name = "temp-email-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = ["/", "/api/*", "/admin/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "temp-email-db"
# 一键部署向导会自动创建 D1 并填充 ID；本地手动部署请填入 wrangler d1 create 返回的真实 UUID
database_id = ""

[triggers]
crons = ["0 * * * *"] # 每小时执行一次，按控制台系统设置清理历史过期数据
