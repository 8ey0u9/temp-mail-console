name = "temp-email-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = ["/", "/api/*", "/admin/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "temp-email-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# 非敏感配置；ADMIN_TOKEN 与 API_TOKEN 请在本地通过 .dev.vars、线上通过 `wrangler secret put` 设置
FORWARD_TO = ""
RETENTION_HOURS = "48"

[triggers]
crons = ["0 * * * *"] # 每小时执行一次，检查并清理超过 RETENTION_HOURS 小时的历史数据
