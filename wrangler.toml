name = "temp-email-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = ["/", "/api/*", "/admin/*", "/healthz"]

[[d1_databases]]
binding = "DB"
database_name = "temp-email-db"
# 一键部署向导会自动创建 D1 并填充 ID；本地手动部署请填入 wrangler d1 create 返回的真实 UUID
database_id = ""

[vars]
# 仅存放非敏感变量；ADMIN_TOKEN、API_TOKEN 与可选的 FORWARD_TO 请通过 Cloudflare Variables and Secrets、wrangler secret put 或本地 .dev.vars 配置，严禁提交到公开仓库
RETENTION_HOURS = "48"

[triggers]
crons = ["0 * * * *"] # 每小时执行一次，检查并清理超过 RETENTION_HOURS 小时的历史数据
